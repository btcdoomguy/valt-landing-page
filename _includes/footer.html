{% assign t = site.data[page.lang] %}

<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <div class="logo">
          <img src="{{ '/assets/images/valt-logo.png' | relative_url }}" alt="VALT" class="logo-icon">
          <span>VALT</span>
        </div>
        <p class="footer-tagline">{{ t.footer.tagline }}</p>
      </div>

      <div class="footer-links">
        <a href="https://github.com/btcdoomguy/valt" target="_blank" rel="noopener">{{ t.footer.links.github }}</a>
        <a href="https://github.com/btcdoomguy/valt/releases" target="_blank" rel="noopener">{{ t.footer.links.releases }}</a>
        <a href="https://github.com/btcdoomguy/valt/issues" target="_blank" rel="noopener">{{ t.footer.links.issues }}</a>
      </div>
    </div>

    <div class="footer-bottom">
      <p>{{ t.footer.copyright }}</p>
      <p class="made-with">{{ t.footer.made_with }} {{ t.footer.by }}</p>
    </div>
  </div>
</footer>

<script>
  // Mobile menu toggle
  document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
    document.querySelector('.nav-links').classList.toggle('active');
    this.classList.toggle('active');
  });

  // Smooth scroll for anchor links
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
      e.preventDefault();
      const target = document.querySelector(this.getAttribute('href'));
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // Close mobile menu if open
        document.querySelector('.nav-links').classList.remove('active');
        document.querySelector('.mobile-menu-btn').classList.remove('active');
      }
    });
  });
</script>
