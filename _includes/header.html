{% assign t = site.data[page.lang] %}

<header class="header">
  <nav class="nav container">
    <a href="{{ page.lang | prepend: '/' | relative_url }}" class="logo">
      <img src="{{ '/assets/images/valt-logo.png' | relative_url }}" alt="VALT" class="logo-icon">
      <span>VALT</span>
    </a>

    <div class="nav-links">
      <a href="#features">{{ t.nav.features }}</a>
      <a href="#screenshots">{{ t.nav.screenshots }}</a>
      <a href="#download">{{ t.nav.download }}</a>
      <a href="https://github.com/btcdoomguy/valt" target="_blank" rel="noopener">{{ t.nav.github }}</a>
      <a href="https://btcdoomguy.github.io/valt-docs" target="_blank" rel="noopener">{{ t.nav.docs }}</a>
      <a href="{{ t.language.switch_url | relative_url }}" class="lang-switch">{{ t.language.switch }}</a>
    </div>

    <button class="mobile-menu-btn" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
</header>
