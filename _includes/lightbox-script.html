<script>
  const screenshots = [
    '/assets/images/screenshots/new/overview.png',
    '/assets/images/screenshots/new/reports.png',
    '/assets/images/screenshots/new/avgprice.png',
    '/assets/images/screenshots/new/theme1.png',
    '/assets/images/screenshots/new/theme2.png',
    '/assets/images/screenshots/new/theme3.png'
  ];

  let currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    const lightbox = document.getElementById('lightbox');
    const img = document.getElementById('lightbox-img');
    img.src = screenshots[index];
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(event) {
    if (event) event.stopPropagation();
    const lightbox = document.getElementById('lightbox');
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  function navigateLightbox(direction, event) {
    if (event) event.stopPropagation();
    currentIndex = (currentIndex + direction + screenshots.length) % screenshots.length;
    const img = document.getElementById('lightbox-img');
    img.src = screenshots[currentIndex];
  }

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    const lightbox = document.getElementById('lightbox');
    if (!lightbox.classList.contains('active')) return;

    if (e.key === 'Escape') {
      closeLightbox();
    } else if (e.key === 'ArrowLeft') {
      navigateLightbox(-1);
    } else if (e.key === 'ArrowRight') {
      navigateLightbox(1);
    }
  });
</script>
